# ==========================================
# Video Summarizer - Docker Compose
# ==========================================
# Quick start: docker-compose up
# With API:    docker-compose --profile api up

version: '3.8'

services:
  # Main Gradio Web UI
  video-summarizer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-summarizer
    ports:
      - "7860:7860"
    volumes:
      # Mount local directories for persistent storage
      - ./data:/app/data:ro          # Input videos (read-only)
      - ./outputs:/app/outputs       # Generated outputs
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # REST API (optional - use with --profile api)
  video-summarizer-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-summarizer-api
    profiles:
      - api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "api.py"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Named volumes for production use
volumes:
  outputs:
    driver: local
